<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
  <title>Recomendações NutriCheck+</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    // Set <html lang> before anything renders
    (function () {
      const p = new URLSearchParams(window.location.search).get("lang");
      if (p === "eng") document.documentElement.lang = "en";
    })();
  </script>
</head>

<body>
  <h1>As Suas Recomendações NutriCheck+</h1>

  <div id="resultado">
    <p>A carregar as suas recomendações…</p>
  </div>

  <!-- BOTÃO DOWNLOAD (fora de cards) -->
  <div id="downloadArea"></div>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close-btn">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
